<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALPHA GROWTH | Demo Lead Desk</title><style>body{margin:0;background:#10100f;color:#f5f3ee;font:14px Arial;padding:28px}main{max-width:1000px;margin:auto}a,button{color:#d2ad65}button{background:#d2ad65;color:#111;border:0;padding:11px 16px;border-radius:20px;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:12px;border-bottom:1px solid #444}small{color:#aaa}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}</style></head><body><main><div class="top"><div><h1>ALPHA GROWTH / LEAD DESK</h1><small>Local browser demo only — not a shared CRM.</small></div><div><button id="export">Export CSV</button> <button id="clear">Clear demo leads</button></div></div><p><a href="./">← Back to ALPHA GROWTH</a></p><table><thead><tr><th>Name</th><th>Business</th><th>Phone</th><th>Location</th><th>Need</th><th>Received</th></tr></thead><tbody id="rows"></tbody></table></main><script>const get=()=>JSON.parse(localStorage.getItem('alphaGrowthLeads')||'[]');function render(){const a=get();document.getElementById('rows').innerHTML=a.length?a.map(x=>'<tr>'+[x.name,x.business,x.phone,x.location,x.need,new Date(x.createdAt).toLocaleString()].map(v=>'<td>'+String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="6">No demo enquiries saved in this browser.</td></tr>'}render();document.getElementById('export').onclick=()=>{const a=get(),keys=['name','business','phone','location','need','message','createdAt'];const csv=[keys.join(','),...a.map(x=>keys.map(k=>'"'+String(x[k]||'').replace(/"/g,'""')+'"').join(','))].join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const link=document.createElement('a');link.href=u;link.download='alpha-growth-leads.csv';link.click();URL.revokeObjectURL(u)};document.getElementById('clear').onclick=()=>{if(confirm('Delete all demo leads from this browser?')){localStorage.removeItem('alphaGrowthLeads');render()}}</script></body></html>
